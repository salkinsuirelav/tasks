<!doctype html>
<html lang="de" data-design="hero" data-motion>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Tasks</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Tasks">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
  <meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
  <script>
    // Hell/Dunkel sofort setzen, damit nichts aufblitzt
    try { const t = JSON.parse(localStorage.getItem('taskapp-settings') || '{}').theme; if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
    // Design (Glass/Klassisch) pro Gerät, ebenfalls vor dem ersten Zeichnen
    // v0.11: HeroUI-Look ist neuer Standard (eigener Schlüssel, damit alle Geräte einmal umspringen)
    window.applyDesign = function (d) { const h = document.documentElement; h.dataset.design = d; if (d === 'classic') delete h.dataset.motion; else h.dataset.motion = ''; };
    try { window.applyDesign(localStorage.getItem('taskapp-design-v2') || 'hero'); } catch (e) { window.applyDesign('hero'); }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/hero.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main id="main"></main>
  </div>
  <nav class="tabbar" id="tabbar"></nav>
  <div id="pill-root"></div>
  <div id="sheet-root"></div>
  <div id="modal-root"></div>
  <div id="focus-root"></div>
  <div id="toast-root"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
