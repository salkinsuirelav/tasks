<!doctype html>
<html lang="de" data-theme="glass">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Health</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Health">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <meta name="theme-color" content="#f4f3ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
  <script>
    // Design vor dem ersten Zeichnen setzen; Statusleisten-Farbe passend zum Hintergrund, damit oben keine Kante entsteht
    window.applyTheme = function (t) {
      document.documentElement.dataset.theme = t;
      var c = t === 'glass' ? ['#f2efea', '#0f0f12'] : ['#f4f3ef', '#121211'];
      document.querySelectorAll('meta[name=theme-color]').forEach(function (m, i) { m.setAttribute('content', c[i]); });
    };
    try { window.applyTheme(localStorage.getItem('gym-theme') || 'glass'); } catch (e) { window.applyTheme('glass'); }
  </script>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main id="main"></main>
  <nav class="tabbar" id="tabbar"></nav>
  <div id="sheet-root"></div>
  <div id="toast"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
